<path d="M1030 598H1060V460H682"/>
<path d="M900 810V850H1080V440H682"/>
<path d="M450 946V975H270V1000"/><path d="M450 946V975H820V1000"/>
<path d="M270 1170V1210"/>
</g>

<g stroke-width="2">
<rect x="220" y="58" width="460" height="60" rx="8" fill="#e9eef8" stroke="#0b3d91"/>
<rect x="150" y="150" width="600" height="118" rx="8" fill="#fdeaea" stroke="#a4141c"/>
