<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1330" width="1100" height="1330" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#16203a" role="img" aria-label="Diagrama de flujo de la medición de riesgo k y utilidad">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#44536f"/></marker></defs>
<rect width="1100" height="1330" fill="#ffffff"/>
<text x="550" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0b3d91">Cómo se miden el riesgo (k) y la utilidad</text>

<g fill="none" stroke="#44536f" stroke-width="2" marker-end="url(#f)">
<path d="M450 118V148"/><path d="M450 268V298"/><path d="M450 382V412"/><path d="M450 508V538"/>
