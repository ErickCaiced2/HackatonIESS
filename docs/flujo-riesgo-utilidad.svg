<g text-anchor="middle">
<text x="450" y="83" font-weight="700">Cohorte original</text>
<text x="450" y="105">CIE-10 F · 18 años o más · 2023-2025</text>

<text x="450" y="175" font-weight="700">1. Medir ANTES (persona = cédula)</text>
<text x="450" y="199">Agrupar por: fecha_nacimiento, edad, sexo, etnia,</text>
<text x="450" y="219">provincia, canton, establecimiento_id</text>
<text x="450" y="239">k · personas únicas · identificadores · grupos homogéneos</text>
<text x="450" y="259">También se cuentan las personas por región y sexo</text>

<text x="450" y="325" font-weight="700">2. Transformar y minimizar</text>
<text x="450" y="347">Grupo de edad (primera atención) · región · año y mes</text>
<text x="450" y="369">Eliminar columnas no pedidas e identificadores</text>

<text x="450" y="439" font-weight="700">3. Calcular k por persona</text>
<text x="450" y="461">Agrupar por grupo_edad + sexo + región</text>
<text x="450" y="481">Contar personas DISTINTAS en cada grupo</text>
<text x="450" y="501">Si está en varios grupos, tomar el menor</text>

<text x="450" y="594" font-weight="700">¿Alguien tiene</text><text x="450" y="616" font-weight="700">k &lt; meta (≥ 5)?</text>
<text x="450" y="773" font-weight="700">¿l ≥ 2 y un grupo</text><text x="450" y="795" font-weight="700">tiene &lt; l diagnósticos?</text>

<text x="901" y="586" font-weight="700">Suprimir por k</text>
<text x="901" y="606">Todas las filas de esas</text><text x="901" y="625">personas</text>
<text x="901" y="772" font-weight="700">Suprimir por diversidad</text><text x="901" y="795">Todas sus filas</text>

<text x="450" y="907" font-weight="700">4. Dataset de salida</text>
<text x="450" y="930">Código aleatorio por persona, sin guardar correspondencia</text>

<text x="270" y="1028" font-weight="700">5A. Medir riesgo DESPUÉS</text>
<text x="270" y="1056">k mínimo = menor k por persona</text>
<text x="270" y="1080">Únicas = personas con k = 1 ÷ total</text>
<text x="270" y="1104">Identificadores en columnas y en texto</text>
<text x="270" y="1128">Grupos homogéneos: k ≥ meta y un solo</text>
<text x="270" y="1150">diagnóstico (3 primeros caracteres)</text>

<text x="820" y="1028" font-weight="700">5B. Medir UTILIDAD (cohorte vs. salida)</text>
<text x="820" y="1056">Conservadas = personas de salida ÷ cohorte</text>
<text x="820" y="1084">Por cada celda región · sexo de la cohorte:</text>
<text x="820" y="1108">|antes − después| ÷ antes × 100</text>
<text x="820" y="1136">Celda desaparecida = 100 %</text>
<text x="820" y="1162">Informar máximo y promedio simple de las celdas</text>
<text x="820" y="1188" font-size="13">La utilidad se informa; no decide APTO</text>

<text x="270" y="1236" font-weight="700">APTO / NO APTO (8 verificaciones)</text>
<text x="270" y="1258" font-size="14">k ≥ meta · 0 identificadores · salida no vacía · trazabilidad</text>
<text x="270" y="1280" font-size="14">Con l ≥ 2: 0 grupos homogéneos</text>
</g>

<g font-weight="700">
<text x="620" y="590" fill="#a4141c">Sí</text><text x="620" y="770" fill="#a4141c">Sí</text>
<text x="462" y="692" fill="#0d6b32">No</text><text x="462" y="864" fill="#0d6b32">No (o l = 1)</text>
<text x="710" y="432" font-size="13">Volver a calcular k</text>
</g>

<text x="550" y="1318" text-anchor="middle" font-size="13" fill="#a4141c">Límite: la k del reto no incluye año-mes, tipo de atención, diagnóstico ni estancia. APTO no significa riesgo cero.</text>
</svg>
